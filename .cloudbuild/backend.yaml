# Expected Substitution Variables:
# _SERVICE_NAME: The name of the Cloud Run service (e.g., my-backend-service)
# _REGION: The region to deploy to (e.g., europe-west2)
steps:
  # 1. Build the Docker image from the root context using the backend Dockerfile
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/${_SERVICE_NAME}-backend:$COMMIT_SHA"
      - "-f"
      - "apps/backend/Dockerfile"
      - "."

  # 2. Push the built image to Google Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/${_SERVICE_NAME}-backend:$COMMIT_SHA"

  # 3. Deploy the new image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}" # Service name passed as substitution
      - "--image"
      - "gcr.io/$PROJECT_ID/${_SERVICE_NAME}-backend:$COMMIT_SHA"
      - "--region"
      - "${_REGION}" # Region passed as substitution
      - "--allow-unauthenticated"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "10"

images:
  # Ensures the image is correctly tracked by Cloud Build
  - "gcr.io/$PROJECT_ID/${_SERVICE_NAME}-backend:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
